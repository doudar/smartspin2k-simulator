[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartspin2k-simulator"
version = "0.1.0"
description = "Independent bike plant and firmware-boundary regression experiments for SmartSpin2k"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/doudar/smartspin2k-simulator"
Issues = "https://github.com/doudar/smartspin2k-simulator/issues"

[project.optional-dependencies]
reports = ["matplotlib>=3.8,<4", "scipy>=1.11,<2", "fitdecode>=0.11,<0.12"]
bench = ["dbus-next>=0.2.3,<0.3", "bleak>=0.22,<3", "pyserial-asyncio>=0.6,<1"]

[project.scripts]
ss2k-sim = "ss2k_sim.cli:main"
ss2k-bench = "ss2k_sim.ble.bench:main"

[tool.setuptools.packages.find]
include = ["ss2k_sim*"]

[tool.setuptools.package-data]
ss2k_sim = ["profiles/*.json", "workouts/*"]
