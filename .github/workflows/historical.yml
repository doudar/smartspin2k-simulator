name: Historical release experiment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/historical.yml', 'dashboard/compatibility/history-adapter.patch']
permissions:
  contents: read
jobs:
  releases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: d475d9fa647b8d38ef677956bf4eaa5b08a79f45
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: f836c058d5ab474c36ec6f9384256db70596ac5c
          path: adapter
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: 082d1ee26ddb009d5132547087f77be03d1b0ab7
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: afe356dc3ae828a4afcfdc5a92968bfa1d4175db
          path: candidate-26.8.23
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: 8e861fbbf9e162497647318e3ddb8823926fcce9
          path: candidate-26.9.15
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: 782c2b5e303115f90bf8f81b724da5717362de39
          path: candidate-current
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare pinned engine and reviewed adapter-only compatibility
        run: |
          python -m pip install -e ./engine
          git -C adapter apply --check "$GITHUB_WORKSPACE/simulator/dashboard/compatibility/history-adapter.patch"
          git -C adapter apply "$GITHUB_WORKSPACE/simulator/dashboard/compatibility/history-adapter.patch"
          python -m ss2k_sim check-adapter --firmware-root adapter --adapter-sha256 098a900211f1803e2723634325061b6185b1d5e2fb20e13e8698d42097910f32
      - name: Stuck-motor negative control with compatibility adapter
        env:
          SS2K_FIRMWARE_ROOT: ${{ github.workspace }}/adapter
        run: python -m unittest discover -s engine/tests -p test_packet_ride.py -v
      - name: Run all pinned release candidates without stopping on quality failures
        run: python simulator/dashboard/history_batch.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-evidence
          path: output
          retention-days: 90
      - name: History summary
        if: always()
        run: |
          echo '## Retrospective release experiments' >> "$GITHUB_STEP_SUMMARY"
          echo '[Dashboard](https://doudar.github.io/smartspin2k-simulator/) · [Raw run artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})' >> "$GITHUB_STEP_SUMMARY"
          echo 'Candidates: 26.8.23, 26.9.15, 26.10.1 and 782c2b5; same baseline26.10.1, simulator, model, scenarios and seeds. Release dates differ from these run dates. Audit JSON verifies extracted production functions. Exit1 records quality-band failures; failed/incomplete outputs still publish.' >> "$GITHUB_STEP_SUMMARY"
