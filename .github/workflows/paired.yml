name: Paired firmware experiment
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Firmware ref resolved once alongside develop and the three latest stable releases
        default: erg-spike-gate
        required: true
permissions:
  contents: read
jobs:
  experiment:
    uses: ./.github/workflows/automatic.yml
    with:
      candidate_ref: ${{ inputs.candidate_ref }}
      suite: short
