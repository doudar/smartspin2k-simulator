name: Automatic firmware comparison
on:
  push:
    branches: [main]
    paths: ['requests/pr-*/**.json']
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Firmware ref to resolve once (PR relay uses an exact head SHA)
        default: erg-spike-gate
        required: true
      suite:
        type: choice
        options: [both, short, long]
        default: both
  workflow_call:
    inputs:
      candidate_ref:
        type: string
        default: erg-spike-gate
      suite:
        type: string
        default: both
permissions:
  contents: read
concurrency:
  group: automatic-${{ github.event_name }}-${{ github.sha }}-${{ inputs.suite || 'both' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      baseline: ${{ steps.plan.outputs.baseline }}
      engine: ${{ steps.plan.outputs.engine }}
      adapter: ${{ steps.adapter.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate request and resolve candidate, develop and three recent stable releases once
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CANDIDATE_REF: ${{ inputs.candidate_ref || 'erg-spike-gate' }}
          SUITE: ${{ inputs.suite || 'both' }}
        run: |
          export PYTHONPATH=.
          if [ "$EVENT_NAME" = push ]; then
            [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]]
            git diff --name-only "$BEFORE" "$GITHUB_SHA" -- requests/ > changed-requests.txt
            [ "$(wc -l < changed-requests.txt)" -eq 1 ]
            python dashboard/automation_plan.py --request "$(cat changed-requests.txt)" --suite "$SUITE" --github-output
          else
            python dashboard/automation_plan.py --candidate-ref "$CANDIDATE_REF" --suite "$SUITE" --github-output
          fi
      - name: Read reviewed adapter identity
        id: adapter
        run: |
          python - <<'PY'
          import json,os,re
          p=json.load(open('dashboard/compatibility/longride-adapter-provenance.json'))
          assert re.fullmatch('[0-9a-f]{40}',p['base_firmware_adapter_sha'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('sha='+p['base_firmware_adapter_sha']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-plan
          path: experiment-plan.json
  fixtures:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {path: simulator, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: experiment-plan}
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: ${{ needs.plan.outputs.adapter }}
          path: adapter
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: ${{ needs.plan.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install numpy==2.2.6 -e ./simulator
          git -C adapter apply "$GITHUB_WORKSPACE/simulator/dashboard/compatibility/history-adapter.patch"
          python - <<'PY'
          import json
          from ss2k_sim.adapter import load_adapter
          load_adapter('adapter',json.load(open('simulator/dashboard/compatibility/longride-adapter-provenance.json'))['compatible_adapter_fingerprint'])
          json.dump(json.load(open('experiment-plan.json'))['baseline_selection'],open('baseline-selection.json','w'))
          PY
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: fixtures
          key: fixtures-v1-${{ runner.os }}-${{ needs.plan.outputs.engine }}-${{ needs.plan.outputs.baseline }}-${{ needs.plan.outputs.adapter }}
      - name: Train identical shared fixture on frozen develop
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SS2K_BASELINE_SELECTION: ${{ github.workspace }}/baseline-selection.json
        run: |
          python -m ss2k_sim.longride train --firmware-root adapter --candidate-root baseline --output fixtures
          find fixtures -type d -name build -prune -exec rm -rf {} +
          python - <<'PYMETA'
          import json,datetime
          p=json.load(open('experiment-plan.json'));m={'candidate_commit':p['baseline_selection']['commit'],'candidate_ref':'develop','baseline_selection':p['baseline_selection'],'run_completed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'notes':'Shared fixture trained once by the exact resolved develop firmware on the same physical model. Reused unchanged for every candidate and release.'}
          json.dump(m,open('fixtures/run-metadata.json','w'))
          PYMETA
      - uses: actions/cache/save@v4
        if: success() && steps.cache.outputs.cache-hit != 'true'
        with:
          path: fixtures
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: shared-fixtures, path: fixtures, if-no-files-found: error}
  compare:
    needs: [plan, fixtures]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: {path: simulator, persist-credentials: false}
      - uses: actions/download-artifact@v4
        with: {name: experiment-plan}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: shared-fixtures, path: fixtures}
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: ${{ needs.plan.outputs.adapter }}
          path: adapter
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: ${{ needs.plan.outputs.baseline }}
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: doudar/SmartSpin2k
          ref: ${{ matrix.commit }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install trusted evaluator and validate adapter
        run: |
          python -m pip install numpy==2.2.6 -e ./simulator
          git -C adapter apply "$GITHUB_WORKSPACE/simulator/dashboard/compatibility/history-adapter.patch"
          python - <<'PY'
          import json
          from ss2k_sim.adapter import load_adapter
          load_adapter('adapter',json.load(open('simulator/dashboard/compatibility/longride-adapter-provenance.json'))['compatible_adapter_fingerprint'])
          PY
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: output
          key: evidence-v1-${{ runner.os }}-${{ needs.plan.outputs.engine }}-${{ needs.plan.outputs.baseline }}-${{ matrix.id }}-${{ matrix.commit }}-${{ needs.plan.outputs.adapter }}-${{ inputs.suite || 'both' }}
      - name: Build trusted token-free execution environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: docker build -t ss2k-evaluator -f simulator/ci/Dockerfile simulator/ci
      - name: Run all requested tests even when quality gates fail
        id: run
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REVISION: ${{ matrix.id }}
          SUITE: ${{ inputs.suite || 'both' }}
        run: |
          mkdir -p output fixtures
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges \
            --env GITHUB_RUN_ID --env GITHUB_RUN_ATTEMPT \
            --user "$(id -u):$(id -g)" --pids-limit 256 --memory 6g --cpus 2 \
            -v "$GITHUB_WORKSPACE/simulator:/inputs/simulator:ro" \
            -v "$GITHUB_WORKSPACE/adapter:/inputs/adapter:ro" \
            -v "$GITHUB_WORKSPACE/baseline:/inputs/baseline:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/inputs/candidate:ro" \
            -v "$GITHUB_WORKSPACE/fixtures:/inputs/fixtures:ro" \
            -v "$GITHUB_WORKSPACE/experiment-plan.json:/inputs/experiment-plan.json:ro" \
            -v "$GITHUB_WORKSPACE/output:/output" \
            ss2k-evaluator sh /inputs/simulator/ci/run-isolated.sh "$REVISION" "$SUITE"
      - name: Reject unsafe files before trusted upload or caching
        if: always()
        run: python simulator/dashboard/sanitize_evidence.py output
      - name: Mark reuse explicitly and preserve original result
        if: always()
        env:
          REVISION: ${{ matrix.id }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output')/os.environ['REVISION'];p.mkdir(parents=True,exist_ok=True)
          result=p/'batch-result.json'
          origin=json.load(open(result)) if result.is_file() else {}
          json.dump({'reused':os.environ['CACHE_HIT']=='true','cache_key':os.environ['CACHE_KEY'],'source_run_id':origin.get('source_run_id'),'source_attempt':origin.get('source_attempt')},open(p/'cache-state.json','w'))
          if os.environ['CACHE_HIT']=='true':raise SystemExit(max(json.load(open(result))['exit_codes'].values()))
          PY
      - name: Determine complete reusable coverage
        id: reusable
        if: always() && steps.cache.outputs.cache-hit != 'true'
        env:
          REVISION: ${{ matrix.id }}
          SUITE: ${{ inputs.suite || 'both' }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('output')/os.environ['REVISION'];suite=os.environ['SUITE'];ok=True
          for sub,file in [('short','comparison.json'),('long/paired','longride.json')]:
              if (sub=='short' and suite=='long') or (sub!='short' and suite=='short'):continue
              f=p/sub/file
              ok=ok and f.is_file() and json.load(open(f)).get('status')=='complete'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('complete='+str(ok).lower()+'\n')
          PY
      - uses: actions/cache/save@v4
        if: always() && steps.reusable.outputs.complete == 'true'
        with:
          path: output
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.id }}
          path: output
          retention-days: 90
  evidence:
    needs: [plan, fixtures, compare]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: evidence-*
          merge-multiple: true
          path: output
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: {name: experiment-plan, path: output}
      - uses: actions/upload-artifact@v4
        with:
          name: paired-evidence
          path: output
          if-no-files-found: error
          retention-days: 90
